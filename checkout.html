<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <!-- bootstrap -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

    <!-- font awesome -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css"
        integrity="sha384-50oBUHEmvpQ+1lW4y57PTFmhCaXp0ML5d60M1M7uH2+nqUivzIebhndOJK28anvf" crossorigin="anonymous">

    <link rel="stylesheet" href="checkout.css">
    <title>Checkout Page</title>
    <!--begin Convert Experiences code-->
    <script type="text/javascript">
    var _conv_page_type = "checkout";
    var _conv_category_id = "shop";
    var _conv_category_name = "Shop";
    var _conv_product_sku = "SKU-COOK-OIL-001";
    var _conv_product_name = "Cooking Oil";
    var _conv_product_price = "10.5";
    var _conv_customer_id = "TEST-CUST-001";
    var _conv_custom_v1 = "test-segment-a";
    var _conv_custom_v2 = "returning-visitor";
    var _conv_custom_v3 = "paid";
    var _conv_custom_v4 = "checkout-page-v1";
    <!--end of editing here-->
    </script>
    <script type="text/javascript" src="//cdn-4.convertexperiments.com/v1/js/10041607-100414372.js?environment=production"></script>
<!-- end Convert Experiences code -->
</head>

<body>
    <!-- header -->
    <h1 class="text-center head m-4">Checkout Page</h1>
    <!-- header -->
    <!-- icons starts here -->
    <div class="icons">
        <div class="row mr-0">
            <div class="col-sm-6">
                <h2 class="m-5 bord shadow-lg"><i class="fas fa-dollar-sign bg p-4 mr-4"></i>Cash on Delivery</h2>
            </div>
            <div class="col-sm-6 ">
                <h2 class="m-5 bord shadow-lg"><i class="fas fa-arrows-alt-h bg p-4 mr-4"></i>100% Return</h2>
            </div>
        </div>

        <div class="row mr-0">
            <div class="col-sm-6">
                <h2 class="m-5 bord shadow-lg"><i class="far fa-thumbs-up bg p-4 mr-4"></i>Quality Assured</h2>
            </div>
            <div class="col-sm-6 ">
                <h2 class="m-5 bord shadow-lg"><i class="fas fa-stopwatch bg p-4 mr-4"></i>Delivery on time</h2>
            </div>
        </div>
    </div>
    <!-- icons end here -->
    <!-- Checkout starts here -->
    <form class="form" onsubmit="return false;">
        <div class="row bord p-4 shadow-lg m-5">
            <div class="col-sm-6">
                <div class="col-sm-6 mt-2 row">
                    <h5 class="my-auto">First Name :</h5>
                    <input id="firstName" class="ml-3 name input" type="text" placeholder="First Name" />
                </div>
                <div class="col-sm-6 mt-2 row ">
                    <h5 class="my-auto">Email :</h5>
                    <input id="email" class="ml-3 input" type="text" placeholder="Email" />
                </div>
                <div class="col-sm-6 mt-3 row ">
                    <h5 class="my-auto">Address :</h5>
                    <input id="address" class="ml-3 input" type="text" placeholder="Address" />
                </div>
            </div>
            <div class="col-sm-6">
                <div class="col-sm-6 mt-2 row">
                    <h5 class="my-auto name my-auto">Last Name :</h5>
                    <input id="lastName" class="ml-3 input" type="text" placeholder="Last Name" />
                </div>
                <div class="col-sm-6 mt-2 row">
                    <h5 class="my-auto my-auto">Password :</h5>
                    <input id="password" class="ml-3 input caps" title="(4-8 characters)" type="password"
                        placeholder="Password" />
                    <p id="text">Your Caps-Lock is on!</p>
                </div>
                <div class="col-sm-6 mt-3 row">
                    <h5 class="my-auto my-auto">Phone Number :</h5>
                    <input id="phone" class="ml-3 validation input" type="text" placeholder="Phone No." />
                </div>
            </div>
        </div>


        <!-- Checkout ends here -->
        <!-- Buy button -->
        <div class="m-5 final text-center">
            <button type="button" id="btn" class="p-2 px-4 btn shadow-lg" onclick="validate()"><i class="fas fa-cart-arrow-down p-2"></i>Buy</button>
        </div>
    </form>
    <!-- Buy Button -->
    <!-- script tags -->
    <script src="checkout.js"></script>

</body>

</html>
