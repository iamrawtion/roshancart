<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- bootstrap -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  <!-- font awesome -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css"
    integrity="sha384-50oBUHEmvpQ+1lW4y57PTFmhCaXp0ML5d60M1M7uH2+nqUivzIebhndOJK28anvf" crossorigin="anonymous">

  <link rel="stylesheet" href="grocery.css">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>ShopNow</title>
  <!--begin Convert Experiences code-->
  <script type="text/javascript">
  var _conv_page_type = "category";
  var _conv_category_id = "shop";
  var _conv_category_name = "Shop";
  var _conv_product_sku = "SKU-COOK-OIL-001";
  var _conv_product_name = "Cooking Oil";
  var _conv_product_price = "10.5";
  var _conv_customer_id = "TEST-CUST-001";
  var _conv_custom_v1 = "test-segment-a";
  var _conv_custom_v2 = "returning-visitor";
  var _conv_custom_v3 = "organic";
  var _conv_custom_v4 = "category-page-v1";
  <!--end of editing here-->
  </script>
  <script type="text/javascript" src="//cdn-4.convertexperiments.com/v1/js/10041607-100414372.js?environment=production"></script>
<!-- end Convert Experiences code -->
</head>

<body>
  <!-- navbar starts here -->
  <nav class="navbar navbar-expand-md bg-secondary sticky-top">
    <a class="navbar-brand text-white" href="index.html"><span><i class="fas fa-shopping-cart mr-2"></i></span>
      <span>ShopNow</span> </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item">
          <a class="nav-link" href="#grocery">Grocery <span class="sr-only">(current)</span></a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#shoes"> Shoes</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#clothes"> Clothes</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#beauty"> Beauty</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white btn" id="cart" type="button" data-toggle="modal"
            data-target="#exampleModalScrollable" onclick="cart()" href="#beauty"><i class="fas fa-cart-arrow-down"></i>
            My Cart</a>
        </li>
  </nav>
  <!-- navbar ends here -->
  <h1 class="text-center mt-3 m-5">Welcome to the ShopNow</h1>

  <!-- page layout: products + live cart sidebar -->
  <div class="page-layout">
    <div class="products-area">

  <!-- cards starts here -->
  <!-- Grocery part starts here -->
  <h2 class="text-center"><i class="fas fa-shopping-basket mr-2"></i>Grocery</h2>
  <div id="grocery" class="row ml-3 m-5">
    <div id="products-grocery" class="d-flex flex-wrap w-100">
      <p class="text-center text-muted col-12">Loading products&hellip;</p>
    </div>
  </div>
  <!-- grocery part ends here -->
  <!-- beauty part starts here -->
  <h2 class="text-center"><i class="fas fa-heart mr-2"></i>Beauty</h2>
  <div id="beauty" class="row ml-3 m-5">
    <div id="products-beauty" class="d-flex flex-wrap w-100">
      <p class="text-center text-muted col-12">Loading products&hellip;</p>
    </div>
  </div>
  <!-- beauty part ends here -->

  <!-- clothes part starts here -->
  <h2 class="text-center"><i class="fas fa-tshirt mr-2"></i>Clothes</h2>
  <div id="clothes" class="row ml-3 m-5">
    <div id="products-clothes" class="d-flex flex-wrap w-100">
      <p class="text-center text-muted col-12">Loading products&hellip;</p>
    </div>
  </div>

  <!-- clothes part ends here -->

  <!-- shoes part starts here -->
  <h2 class="text-center"><i class="fas fa-shoe-prints mr-2"></i>Shoes</h2>
  <div id="shoes" class="row ml-3 m-5">
    <div id="products-shoes" class="d-flex flex-wrap w-100">
      <p class="text-center text-muted col-12">Loading products&hellip;</p>
    </div>
  </div>

  <!-- shoes part ends here -->
  <!-- cards ends here -->

    </div><!-- end products-area -->

    <!-- live cart sidebar -->
    <div class="cart-sidebar" id="cartSidebar">
      <h5><i class="fas fa-cart-arrow-down mr-2"></i>My Cart</h5>
      <ul class="sidebar-list" id="sidebarList">
        <li class="empty-msg">Your cart is empty</li>
      </ul>
      <div class="sidebar-total" id="sidebarTotal"></div>
      <a href="#" onclick="goToCheckout(); return false;" class="btn sidebar-checkout">Checkout</a>
    </div>

  </div><!-- end page-layout -->

  <!-- modal starts here -->
  <div class="modal fade" id="exampleModalScrollable" tabindex="-1" role="dialog"
    aria-labelledby="exampleModalScrollableTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalScrollableTitle"><i class="fas fa-cart-arrow-down"></i>My Cart</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <!-- listing items starts -->
          <div>
            <ul class="list">

            </ul>
            <div>
              <h3 class="bill px-5">Select Something</h3>
            </div>
            <div>
              <a href="#" onclick="goToCheckout(); return false;" class="btn checkout m-3">Checkout</a>
            </div>
          </div>
          <!-- listing items ends -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
  <!-- modal ends here -->
  <!-- <button id="cart"  type="button" class="btn m-5" data-toggle="modal" data-target="#exampleModalScrollable" onclick="cart()">My Cart</button>
  -->
  <!-- script tags -->
  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
    integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous">
  </script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
    integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous">
  </script>
  <script src="shopify-config.js"></script>
  <script src="script.js"></script>
</body>

</html>
